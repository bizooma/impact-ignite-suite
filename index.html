<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9b87f5" />
    <link rel="icon" href="/favicon.png" type="image/png">
    
    <!-- Default meta tags - will be overridden by React Helmet on each page -->
    <title>Causeio - Marketing Platform for Nonprofits & Charities</title>
    <meta name="description" content="Empower your nonprofit with AI chatbots, dynamic QR codes, social media automation, and SEO optimization. Everything charities need to attract donors, recruit volunteers, and grow community support." />
    <meta name="keywords" content="nonprofit marketing, charity marketing, donor engagement, volunteer recruitment, AI chatbots for nonprofits, fundraising tools, nonprofit social media, charity QR codes" />
    <meta name="author" content="Causeio" />
    
    <!-- Default Open Graph tags -->
    <meta property="og:site_name" content="Causeio" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Performance & Technical SEO -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Aggressive blocker for legacy Causeio widget -->
    <style>
      #causeio-widget-root,
      [id*="causeio"][id*="widget"],
      iframe[src*="supabase.co/storage"][src*="widget"] { 
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        'use strict';
        
        // Block legacy widget scripts before they load
        var originalAppendChild = Element.prototype.appendChild;
        var originalInsertBefore = Element.prototype.insertBefore;
        
        function blockLegacyWidget(node) {
          if (node && node.tagName === 'SCRIPT' && node.src) {
            var src = node.src.toLowerCase();
            if (src.includes('embed.js') || src.includes('widget.umd.js')) {
              console.warn('Blocked legacy Causeio widget script:', node.src);
              return true;
            }
          }
          if (node && node.tagName === 'IFRAME') {
            var src = (node.src || '').toLowerCase();
            // Only allow NPO Bot iframe
            if (!src.includes('npobots.com') && src.includes('widget')) {
              console.warn('Blocked legacy widget iframe:', node.src);
              return true;
            }
          }
          return false;
        }
        
        Element.prototype.appendChild = function(node) {
          if (blockLegacyWidget(node)) return node;
          return originalAppendChild.call(this, node);
        };
        
        Element.prototype.insertBefore = function(node, ref) {
          if (blockLegacyWidget(node)) return node;
          return originalInsertBefore.call(this, node, ref);
        };
        
        // Remove any existing legacy widget elements
        function cleanupLegacyWidget() {
          try {
            // Remove widget containers
            var containers = document.querySelectorAll('#causeio-widget-root, [id*="causeio"][id*="widget"]');
            containers.forEach(function(el) { 
              el.remove();
              console.log('Removed legacy widget container:', el.id);
            });
            
            // Remove legacy widget iframes
            var iframes = document.querySelectorAll('iframe');
            iframes.forEach(function(iframe) {
              var src = (iframe.src || '').toLowerCase();
              if (!src.includes('npobots.com') && src.includes('widget')) {
                iframe.remove();
                console.log('Removed legacy widget iframe');
              }
            });
          } catch (e) {
            console.warn('Cleanup error:', e);
          }
        }
        
        // Monitor for dynamically injected elements
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === 1) { // Element node
                if (blockLegacyWidget(node)) {
                  node.remove();
                }
                // Check children
                if (node.querySelectorAll) {
                  var scripts = node.querySelectorAll('script[src*="embed.js"], script[src*="widget.umd.js"]');
                  scripts.forEach(function(s) { 
                    s.remove();
                    console.warn('Blocked dynamically added widget script');
                  });
                }
              }
            });
          });
          cleanupLegacyWidget();
        });
        
        // Start observing
        if (document.body) {
          observer.observe(document.body, { childList: true, subtree: true });
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body, { childList: true, subtree: true });
          });
        }
        
        // Initial cleanup
        cleanupLegacyWidget();
        setInterval(cleanupLegacyWidget, 1000); // Check every second
      })();
    </script>
    
  </body>
</html>
