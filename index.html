<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9b87f5" />
    <link rel="icon" href="/favicon.png" type="image/png">
    
    <!-- Default meta tags - will be overridden by React Helmet on each page -->
    <title>Causeio - Marketing Platform for Nonprofits & Charities</title>
    <meta name="description" content="Empower your nonprofit with AI chatbots, dynamic QR codes, social media automation, and SEO optimization. Everything charities need to attract donors, recruit volunteers, and grow community support." />
    <meta name="keywords" content="nonprofit marketing, charity marketing, donor engagement, volunteer recruitment, AI chatbots for nonprofits, fundraising tools, nonprofit social media, charity QR codes" />
    <meta name="author" content="Causeio" />
    
    <!-- Default Open Graph tags -->
    <meta property="og:site_name" content="Causeio" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Performance & Technical SEO -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Block legacy Causeio widget if externally injected -->
    <style>#causeio-widget-root { display: none !important; }</style>
    <script>
      (function() {
        try {
          var el = document.getElementById('causeio-widget-root');
          if (el) el.remove();
        } catch (e) { /* noop */ }
      })();
    </script>
    
    <!-- NPO Chatbot Widget -->
    <script src="https://npobots.com/npo-bot.js" data-public-key="707232ac-683f-4ebb-988b-06c66c6067d6" data-position="bottom-right"></script>
  </body>
</html>
